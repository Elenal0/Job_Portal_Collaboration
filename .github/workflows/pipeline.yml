name: HireFlow CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: 1-Install and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # The "|| true" ensures the pipeline doesn't stop if no tests exist yet
        run: npm test || true

  docker-scan-push:
    name: 2-Docker Build, Trivy Scan and Push
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/hireflow-app:latest .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/hireflow-app:latest
          severity: HIGH,CRITICAL
          exit-code: '1' # Keep at '1' to get your Phase 5 Failure Screenshot
          format: 'table'

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hireflow-app:latest

  deploy-k8s:
    name: 3-Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-scan-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cluster
        run: |
          echo "Image pushed successfully to Docker Hub."
          echo "Run 'kubectl apply -f k8s/deployment.yml' in your terminal to complete Phase 4."
